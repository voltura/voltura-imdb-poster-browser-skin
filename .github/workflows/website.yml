name: Website checks

'on':
  push:
    branches: [main]
    paths: ['index.html', 'privacy.html', 'assets/**', 'store/promo/**', 'downloads/**', 'google*.html', 'robots.txt', 'sitemap.xml', 'tests/website.mjs', 'scripts/*site*.mjs', 'package*.json', '.github/workflows/website.yml']
  pull_request:
    paths: ['index.html', 'privacy.html', 'assets/**', 'store/promo/**', 'downloads/**', 'google*.html', 'robots.txt', 'sitemap.xml', 'tests/website.mjs', 'scripts/*site*.mjs', 'package*.json', '.github/workflows/website.yml']
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:website
      - name: Check published website
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run check:public-site
